<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic tac toe</title>
    <script src="script.js" defer></script>
   <link rel="stylesheet" href="style.css">
</head>
<body>
 <h1>Tic Tac Toe</h1>

    <!-- Player Name Inputs -->
    <div class="player-inputs">
        <input type="text" id="p1-input" placeholder="Player X Name" value="Player One">
        <input type="text" id="p2-input" placeholder="Player O Name" value="Player Two">
        <button id="set-names-btn">Set Names</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div><span id="score-p1-label">Player One</span> (X): <span id="score-p1">0</span></div>
        <div>Ties: <span id="score-ties">0</span></div>
        <div><span id="score-p2-label">Player Two</span> (O): <span id="score-p2">0</span></div>
    </div>

    <div id="status">Player One's (X) turn</div>
    
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="reset-btn">Next Round</button>
    <button id="full-reset-btn">Reset All Scores</button>
    
</body>
</html>
